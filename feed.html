<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>xss.html — หน้าทดสอบช่องโหว่ (โดยตั้งใจ)</title>
</head>
<body style="font-family:Tahoma;background:#ddd;max-width:720px;margin:40px auto;padding:0 16px">

<h1>🕳️ หน้าทดสอบ XSS</h1>
<p><b>⚠️ เตือน:</b> ไฟล์นี้มีช่องโหว่ฝังไว้โดยตั้งใจ เพื่อเรียนรู้บนเว็บตัวเองเท่านั้น
อย่าเอาโครงสร้างแบบนี้ไปใช้ในเว็บจริง</p>

<!-- จุดที่ 1+4+5+6 มาจาก URL ?... -->
<div id="greet"></div>
<div id="search"></div>
<a id="lnk" href="#">🔗 ลิงก์จากพารามิเตอร์</a>

<!-- จุดที่ 2 มาจาก #hash -->
<div id="msg"></div>

<!-- จุดที่ 3: คอมเมนต์แบบ stored (เก็บใน localStorage) -->
<hr>
<h3>คอมเมนต์ (ไม่กรองอะไรเลย)</h3>
<input id="c" placeholder="พิมพ์อะไรก็ได้...">
<button onclick="addComment()">โพสต์</button>
<button onclick="localStorage.removeItem('comments');render()">ล้าง</button>
<div id="comments"></div>

<script>
/* ═══ จุดโหว่ 1: Reflected XSS ผ่าน ?name= ═══
   payload: ?name=<img src=x onerror=alert(1)> */
var p = new URLSearchParams(location.search);
document.getElementById('greet').innerHTML = 'สวัสดี ' + (p.get('name') || 'คนแปลกหน้า');

/* ═══ จุดโหว่ 2: DOM XSS ผ่าน #hash ═══
   payload: #<svg onload=alert(2)> */
if (location.hash.length > 1)
  document.getElementById('msg').innerHTML = decodeURIComponent(location.hash.slice(1));

/* ═══ จุดโหว่ 3: Stored XSS (localStorage) ═══
   พิมพ์ <img src=x onerror=alert(3)> ลงกล่องแล้วกดโพสต์
   ปิดแท็บเปิดใหม่ก็ยังทำงาน — เพราะ render จากที่เก็บด้วย innerHTML เสมอ */
function render(){
  var list = JSON.parse(localStorage.getItem('comments') || '[]');
  document.getElementById('comments').innerHTML =
    list.map(function(c){ return '<p>💬 ' + c + '</p>'; }).join('');
}
function addComment(){
  var list = JSON.parse(localStorage.getItem('comments') || '[]');
  list.push(document.getElementById('c').value);
  localStorage.setItem('comments', JSON.stringify(list));
  render();
}
render();

/* ═══ จุดโหว่ 4: javascript: URL ═══
   payload: ?url=javascript:alert(4) แล้วคลิกลิงก์ */
if (p.get('url')) document.getElementById('lnk').href = p.get('url');

/* ═══ จุดโหว่ 5: eval ผ่าน setTimeout ═══
   payload: ?calc=alert(5) */
if (p.get('calc')) setTimeout(p.get('calc'), 0);

/* ═══ จุดโหว่ 6: document.write ═══
   payload: ?q=<img src=x onerror=alert(6)> */
if (p.get('q'))
  document.getElementById('search').innerHTML = '<h3>ผลค้นหา: ' + p.get('q') + '</h3>';
</script>

</body>
</html>
